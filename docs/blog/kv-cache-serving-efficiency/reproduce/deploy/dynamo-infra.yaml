apiVersion: v1
kind: ConfigMap
metadata: {name: dynamo-nats-conf, namespace: kv-fleet}
data:
  nats-server.conf: |
    max_payload: 15728640
    jetstream: {}
    http_port: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dynamo-etcd, namespace: kv-fleet, labels: {app: dynamo-etcd}}
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-etcd}}
  template:
    metadata: {labels: {app: dynamo-etcd}}
    spec:
      nodeSelector: {cloud.google.com/gke-nodepool: cpu-pool-3}
      containers:
      - name: etcd
        image: bitnamilegacy/etcd:3.6.1
        env:
        - {name: ALLOW_NONE_AUTHENTICATION, value: "yes"}
        - {name: ETCD_ADVERTISE_CLIENT_URLS, value: "http://dynamo-etcd.kv-fleet.svc:2379"}
        - {name: ETCD_LISTEN_CLIENT_URLS, value: "http://0.0.0.0:2379"}
        ports: [{containerPort: 2379, name: client}]
        resources: {requests: {cpu: "2", memory: 4Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: dynamo-etcd, namespace: kv-fleet}
spec:
  selector: {app: dynamo-etcd}
  ports: [{name: client, port: 2379, targetPort: 2379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dynamo-nats, namespace: kv-fleet, labels: {app: dynamo-nats}}
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-nats}}
  template:
    metadata: {labels: {app: dynamo-nats}}
    spec:
      nodeSelector: {cloud.google.com/gke-nodepool: cpu-pool-3}
      containers:
      - name: nats
        image: nats:2.11.4
        args: ["-c", "/etc/nats/nats-server.conf"]
        ports: [{containerPort: 4222, name: client}, {containerPort: 8222, name: monitor}]
        volumeMounts: [{name: conf, mountPath: /etc/nats}]
        resources: {requests: {cpu: "2", memory: 4Gi}}
      volumes: [{name: conf, configMap: {name: dynamo-nats-conf}}]
---
apiVersion: v1
kind: Service
metadata: {name: dynamo-nats, namespace: kv-fleet}
spec:
  selector: {app: dynamo-nats}
  ports: [{name: client, port: 4222, targetPort: 4222}, {name: monitor, port: 8222, targetPort: 8222}]
